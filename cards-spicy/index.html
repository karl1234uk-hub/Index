<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Afterdark Pick a Card</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#050102}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
font-family:"Cormorant Garamond",Georgia,serif;color:#f0d0d4;overflow-x:hidden;position:relative;
background:radial-gradient(ellipse at 50% 40%,#3a0510 0%,#0d0204 55%,#030001 100%)}
#snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.flake{position:absolute;top:-20px;color:#ff5a4a;opacity:.0;animation:fall linear infinite;text-shadow:0 0 6px #ff3b30aa}
@keyframes fall{0%{transform:translateY(-20px) translateX(0) rotate(0);opacity:0}10%{opacity:.55}90%{opacity:.35}100%{transform:translateY(660px) translateX(24px) rotate(180deg);opacity:0}}
header,main,footer{position:relative;z-index:1;width:100%;max-width:460px;text-align:center}
header{padding:16px 12px 0}
h1{font-family:"Great Vibes","Snell Roundhand","Brush Script MT",cursive;font-weight:400;font-size:clamp(36px,10vw,46px);line-height:1.05;margin:0;
background:linear-gradient(90deg,#d9455a,#ffc9d0,#b3283d);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 0 14px #a3182f55)}
.sub{margin:4px 0 0;font-size:18px;font-style:italic;color:#d98a95;min-height:24px;letter-spacing:.3px}
.stage{position:relative;width:100%;height:340px;perspective:1100px;margin-top:2px}
.card{position:absolute;left:50%;top:50%;width:190px;height:280px;padding:0;border:0;background:none;cursor:pointer;outline:none;
--x:0px;--y:0px;--r:0deg;--s:.5;--lift:0px;
transform:translate(-50%,-50%) translate(var(--x),calc(var(--y) + var(--lift))) rotate(var(--r)) scale(var(--s));
transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .5s ease;font-family:inherit;color:inherit;
animation:deal .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 60ms)}
@keyframes deal{from{transform:translate(-50%,-50%) translate(0,40px) rotate(0) scale(.2);opacity:0}}
.stage.ready .card:hover,.stage.ready .card:focus-visible{--lift:-16px}
.stage.ready .card:hover .back,.stage.ready .card:focus-visible .back{box-shadow:0 0 0 2px #ff6b81,0 0 30px 4px #e0102f99}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.3,.7,.2,1)}
.card.flipped .flip{transform:rotateY(180deg)}
.card.gone{opacity:0;pointer-events:none;--lift:70px}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:
radial-gradient(circle at 50% 50%,#8f0f26 0%,#5a0716 60%,#1f0208 100%);
border:3px solid #a3182f;box-shadow:0 6px 18px #000a,inset 0 0 0 7px #1f0208,inset 0 0 0 8px #a3182f88;transition:box-shadow .3s}
.back::before{content:"";position:absolute;inset:14px;border:1px solid #d9455aaa;border-radius:8px;
background:repeating-linear-gradient(45deg,#ffffff08 0 6px,transparent 6px 12px),repeating-linear-gradient(-45deg,#00000030 0 6px,transparent 6px 12px)}
.back::after{content:"\2665";position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;
display:flex;align-items:center;justify-content:center;font-size:46px;color:#ffc9d0;line-height:1;
background:radial-gradient(circle,#a50f2a,#5a0716);border:2px solid #d9455a;box-shadow:0 0 18px #e0102f88,inset 0 0 12px #000a;text-shadow:0 0 12px #ff3b57}
.front{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;text-align:center;
background:linear-gradient(170deg,#26050c 0%,#0c0204 100%);border:3px solid #a3182f;box-shadow:0 0 28px #a3182f77,0 8px 22px #000b,inset 0 0 0 6px #0c0204,inset 0 0 0 7px #a3182f55}
.front .pre{font-style:italic;font-size:16px;color:#d98a95;letter-spacing:.4px}
.front .em{font-size:50px;line-height:1.1;margin:8px 0 6px;filter:drop-shadow(0 0 10px #e0102f88)}
.front .big{font-weight:700;font-size:25px;line-height:1.12;
background:linear-gradient(180deg,#ffd6db,#d9455a 60%,#b3283d);-webkit-background-clip:text;background-clip:text;color:transparent}
.front .big.long{font-size:21px}
.front .tag{margin-top:12px;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#a3182f}
.front .fine{margin-top:6px;font-size:14px;font-style:italic;color:#b3283d}
.rare .front{border-color:#d9455a;box-shadow:0 0 30px #d9455a99,0 8px 22px #000b,inset 0 0 0 6px #0c0204,inset 0 0 0 7px #d9455aaa}
.rare .tag{color:#ff7a8e}
.golden .front{border-color:#f2cf7a;background:linear-gradient(170deg,#3a1a0c 0%,#1d0a06 100%);
box-shadow:0 0 36px #f2cf7acc,0 8px 22px #000b,inset 0 0 0 6px #1d0a06,inset 0 0 0 7px #f2cf7acc}
.golden .big{background:linear-gradient(180deg,#fff3c4,#f2cf7a 55%,#c9973a);-webkit-background-clip:text;background-clip:text;color:transparent}
.golden .tag{letter-spacing:2px;white-space:nowrap;color:#f2cf7a;text-shadow:0 0 8px #f2cf7a88}
.golden .front::after{content:"";position:absolute;inset:-40%;pointer-events:none;
background:linear-gradient(115deg,transparent 40%,#fff6cf55 50%,transparent 60%);animation:sheen 2.6s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
.nothing .front .big{background:linear-gradient(180deg,#d9c6c6,#9a8486);-webkit-background-clip:text;background-clip:text;color:transparent}
.nothing .front{border-color:#6a1020}
main{padding:0 14px;min-height:78px}
.msg{font-size:18px;font-style:italic;color:#d98a95;line-height:1.3;min-height:24px}
.count{margin-top:6px;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#a3182f;display:none}
.count b{display:inline-block;min-width:92px;font-size:24px;letter-spacing:3px;font-weight:700;color:#ffd0d6;text-shadow:0 0 12px #a3182f;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:'lnum' 1,'tnum' 1}
.locked .count{display:block}
.note{margin-top:4px;font-size:13px;color:#8a5560;font-style:italic;display:none}
footer{padding:6px 12px 14px;font-family:"Great Vibes","Snell Roundhand","Brush Script MT",cursive;font-size:22px;color:#b3283d;text-shadow:0 0 10px #a3182f66}
.pop{position:absolute;pointer-events:none;z-index:5;left:50%;top:50%;font-size:20px;opacity:0;animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){.flake,.golden .front::after{animation:none}.card,.flip{transition-duration:.01s}.card{animation:none}}

h1{padding:.1em .08em .2em}
body.open h1{font-size:clamp(32px,9vw,40px)}
#gate{position:relative;z-index:2;width:92%;max-width:440px;margin:auto;text-align:center;padding:34px 22px 28px;box-sizing:border-box;
border:1px solid #a3182f;border-radius:10px;background:linear-gradient(180deg,#1a0409,#0a0203);box-shadow:0 0 22px #8f0f26aa,inset 0 0 30px #00000099}
#gate h1{font-size:46px;margin:0 0 14px}
#gate .fmt{font-size:20px;letter-spacing:2px;color:#d9455a;margin-bottom:16px}
#gate input{width:100%;padding:12px;font-size:20px;text-align:center;letter-spacing:4px;background:#050102;color:#ffd0d6;border:1px solid #6a1020;border-radius:6px;outline:none;font-family:inherit}
#gate input:focus{border-color:#d9455a;box-shadow:0 0 10px #e0102f66}
#gate button{margin-top:12px;width:100%;padding:11px;font-size:18px;font-family:inherit;cursor:pointer;color:#ffd0d6;background:linear-gradient(180deg,#6a0a1c,#2a050c);border:1px solid #a3182f;border-radius:6px}
#gate button:hover{background:linear-gradient(180deg,#8f0f26,#3a0710)}
#gate .hint{margin-top:22px;font-size:17px;font-style:italic;color:#d98a95;line-height:1.4}
#gate .err{min-height:22px;margin-top:10px;color:#ff8fa3;font-style:italic;font-size:16px}
#app{display:none;width:100%;min-height:100vh;flex-direction:column;align-items:center;justify-content:space-between;position:relative}
body.open #app{display:flex}body.open #gate{display:none}
body:not(.open){justify-content:center}
</style></head><body>
<div id="gate">
 <h1>Afterdark Pick a Card</h1>
 <input id="pw" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
 <button id="go">Unlock</button>
 <div class="err" id="err"></div>
 <div class="hint">Enter the code, my love 😏</div>
</div>
<div id="app"></div>

const SK="karlos_spicy_unlock_v1";
const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function show(key){
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(B.n)},key,d(B.c));
 const o=JSON.parse(new TextDecoder().decode(pt));
 document.title=o.title;
 document.getElementById('app').innerHTML=o.html;
 document.body.classList.add('open');
 const s=document.createElement('script');s.textContent=o.js;document.body.appendChild(s);
}
async function unlock(){
 const pw=document.getElementById('pw').value.replace(/\D/g,'');
 const err=document.getElementById('err');err.textContent='';
 if(!window.crypto||!crypto.subtle){err.textContent='This browser can\u2019t open it, try another one.';return}
 try{
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(B.s),iterations:B.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  await show(key);
  try{const raw=await crypto.subtle.exportKey('raw',key);sessionStorage.setItem(SK,btoa(String.fromCharCode(...new Uint8Array(raw))))}catch(e){}
 }catch(e){err.textContent='Not quite, sweetheart\u2026 try again 😘'}
}
document.getElementById('go').onclick=unlock;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
(async()=>{
 let k=null;try{k=sessionStorage.getItem(SK)}catch(e){}
 if(!k||!window.crypto||!crypto.subtle)return;
 try{await show(await crypto.subtle.importKey('raw',d(k),{name:'AES-GCM'},false,['decrypt']))}
 catch(e){try{sessionStorage.removeItem(SK)}catch(_){}}
})();
</script>
