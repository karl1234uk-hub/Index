<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Velvet &amp; Sin | After Dark</title>
  <style>
    html { background: #080607; }
    body {
      margin: 0;
      padding: 15px;
      background: #080607;
      color: #DED5D5;
      font-family: Georgia, serif;
    }
    .music-player {
      position: relative;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 20px;
      background: linear-gradient(145deg,#160D10,#080607 75%);
      border: 1px solid #45151F;
      box-shadow: 0 0 22px rgba(101,11,24,.2);
      box-sizing: border-box;
    }
    .play-slot {
      position: relative;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
    }
    .play-slot:hover .btn,
    .play-slot:active .btn {
      background: #650B18;
      color: white;
    }
    .yt-host {
      position: absolute;
      left: 0;
      top: 0;
      width: 44px;
      height: 44px;
      opacity: 0.01;
      z-index: 4;
      overflow: hidden;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .yt-host iframe {
      position: absolute;
      width: 200px;
      height: 200px;
      left: -78px;
      top: -78px;
      border: 0;
      pointer-events: auto;
    }
    .heading {
      text-align: center;
      border-bottom: 1px solid #45151F;
      padding-bottom: 14px;
      margin-bottom: 4px;
    }
    .heading h2 {
      margin: 0;
      padding-left: 4px;
      color: #B98B8F;
      font-size: 24px;
      font-weight: normal;
      letter-spacing: 4px;
      line-height: 1.2;
    }
    .heading p {
      margin: 8px 0 0;
      padding-left: 3px;
      color: #8B1028;
      font-size: 11px;
      letter-spacing: 3px;
    }
    .track {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin: 0;
      padding: 13px 8px;
      border: none;
      border-bottom: 1px solid #241317;
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: inherit;
      text-align: left;
      cursor: pointer;
    }
    .btn {
      box-sizing: border-box;
      width: 34px;
      height: 34px;
      min-width: 34px;
      padding: 0;
      border: 1px solid #711629;
      border-radius: 50%;
      background: #18090D;
      color: #D9A0A5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "DejaVu Sans", "Noto Sans Symbols 2", sans-serif;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    .btn:hover,
    .btn:active,
    .track:hover .btn,
    .track:active .btn,
    .btn.is-on {
      background: #650B18;
      color: white;
    }
    .btn.main {
      width: 44px;
      height: 44px;
      min-width: 44px;
      font-size: 15px;
    }
    .num {
      color: #8B1028;
      font-size: 11px;
      min-width: 18px;
    }
    .name {
      font-size: 14px;
      line-height: 1.3;
    }
    .track.is-active .name { color: #D58A94; }
    .now {
      margin: 16px 0 12px;
      color: #B98B8F;
      font-size: 12px;
      text-align: center;
      min-height: 1.3em;
    }
    .transport {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 0 0 14px;
    }
    .progress {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .time {
      color: #76575B;
      font-size: 10px;
      min-width: 34px;
      font-variant-numeric: tabular-nums;
    }
    .time-end { text-align: right; }
    .bar {
      position: relative;
      flex: 1;
      height: 5px;
      background: #18090D;
      border: 1px solid #45151F;
      box-sizing: content-box;
      cursor: pointer;
    }
    .fill {
      height: 100%;
      width: 0;
      background: #650B18;
      pointer-events: none;
    }
    .track:focus-visible,
    .btn:focus-visible,
    .bar:focus-visible {
      outline: 1px solid #711629;
      outline-offset: 2px;
    }
    footer {
      margin: 16px 0 0;
      padding-left: 2px;
      color: #76575B;
      font-size: 10px;
      letter-spacing: 2px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="music-player">
    <div class="heading">
      <h2>VELVET &amp; SIN</h2>
      <p>THE AFTER DARK PLAYLIST</p>
    </div>
    <div id="tracks"></div>
    <div id="now" class="now" aria-live="polite">LOADING PLAYER…</div>
    <div class="transport">
      <button type="button" class="btn" id="prev" aria-label="Previous">‹</button>
      <div class="play-slot">
        <button type="button" class="btn main" id="play" aria-label="Play">▶</button>
        <div class="yt-host" id="yt-host" aria-hidden="true"></div>
      </div>
      <button type="button" class="btn" id="next" aria-label="Next">›</button>
    </div>
    <div class="progress">
      <span class="time" id="elapsed">0:00</span>
      <div class="bar" id="bar" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="fill" id="fill"></div>
      </div>
      <span class="time time-end" id="duration">0:00</span>
    </div>
    <footer>SOME SINS ARE WORTH SURRENDERING TO</footer>
  </div>
  <script>
    // This document is the embed target. Stay on this window only.
    var TRACKS = [
      { id: 'j_5PhdSz_nE', num: '01', title: 'Cyndr – Mine' },
      { id: 'obk03789Q2w', num: '02', title: 'October Ends – Mine' },
      { id: 'rl_MzzMnQBA', num: '03', title: 'Cyndr – Make Me' },
      { id: 'kAw5uzftBYY', num: '04', title: 'Saint Vice – Body Locked To Mine' },
      { id: 'I2QZ4v-G6AY', num: '05', title: 'Enrique Iglesias – Ring My Bells' }
    ];

    var listEl = document.getElementById('tracks');
    var nowEl = document.getElementById('now');
    var playBtn = document.getElementById('play');
    var prevBtn = document.getElementById('prev');
    var nextBtn = document.getElementById('next');
    var barEl = document.getElementById('bar');
    var fillEl = document.getElementById('fill');
    var elapsedEl = document.getElementById('elapsed');
    var durationEl = document.getElementById('duration');

    var HINT = 'Tap \u25B6 to start';
    var player = null;
    var playerReady = false;
    var activated = false;
    var current = -1;
    var primed = 0;
    var playing = false;
    var queued = -1;
    var queueUser = false;
    var failCount = 0;
    var ignoreError = false;
    var activeId = '';
    var endHandledFor = '';
    var errorHandledFor = '';
    var loadedAt = 0;
    var fitting = false;

    function safeOrigin() {
      try {
        var origin = location.origin;
        if (!origin || origin === 'null') return '';
        if (/^https?:\/\//i.test(origin)) return origin;
      } catch (err) {}
      return '';
    }

    function setStatus(text) {
      nowEl.textContent = text;
    }

    function fmt(sec) {
      sec = Math.floor(Number(sec) || 0);
      if (sec < 0) sec = 0;
      var h = Math.floor(sec / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var s = sec % 60;
      var ss = (s < 10 ? '0' : '') + s;
      if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + ss;
      return m + ':' + ss;
    }

    function resetProgress() {
      elapsedEl.textContent = '0:00';
      durationEl.textContent = '0:00';
      fillEl.style.width = '0%';
      barEl.setAttribute('aria-valuenow', '0');
    }

    function render() {
      var i;
      listEl.textContent = '';
      for (i = 0; i < TRACKS.length; i++) {
        var track = TRACKS[i];
        var row = document.createElement('button');
        row.type = 'button';
        row.className = 'track' + (i === current ? ' is-active' : '');
        row.setAttribute('data-i', String(i));
        var icon = document.createElement('span');
        var on = i === current && playing;
        icon.className = 'btn' + (on ? ' is-on' : '');
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = on ? '❚❚' : '▶';
        var num = document.createElement('span');
        num.className = 'num';
        num.textContent = track.num;
        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = track.title;
        row.appendChild(icon);
        row.appendChild(num);
        row.appendChild(name);
        listEl.appendChild(row);
      }
      playBtn.textContent = playing ? '❚❚' : '▶';
      playBtn.classList.toggle('is-on', playing);
      playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
      playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
    }

    function readState() {
      try { return player.getPlayerState(); } catch (err) { return -1; }
    }

    function fitIframe(frame) {
      if (!frame || fitting) return;
      fitting = true;
      try {
        if (frame.getAttribute('allow') !== 'autoplay; encrypted-media') {
          frame.setAttribute('allow', 'autoplay; encrypted-media');
        }
        if (!frame.hasAttribute('playsinline')) frame.setAttribute('playsinline', '');
        if (!frame.hasAttribute('webkit-playsinline')) frame.setAttribute('webkit-playsinline', '');
        frame.title = 'Audio player';
        frame.style.setProperty('position', 'absolute', 'important');
        frame.style.setProperty('width', '200px', 'important');
        frame.style.setProperty('height', '200px', 'important');
        frame.style.setProperty('left', '-78px', 'important');
        frame.style.setProperty('top', '-78px', 'important');
        frame.style.setProperty('transform', 'none', 'important');
        frame.style.setProperty('border', '0', 'important');
        frame.style.setProperty('pointer-events', 'auto', 'important');
        frame.style.setProperty('opacity', '1', 'important');
      } catch (err) {}
      fitting = false;
    }

    function hardenIframe() {
      try {
        var host = document.getElementById('yt-host');
        var frame = (player && player.getIframe && player.getIframe()) || (host && host.querySelector('iframe'));
        if (!frame) return;
        fitIframe(frame);
        if (frame.__fitBound) return;
        frame.__fitBound = true;
        var obs = new MutationObserver(function () { fitIframe(frame); });
        obs.observe(frame, { attributes: true, attributeFilter: ['style', 'allow', 'width', 'height'] });
      } catch (err) {}
    }

    function videoIdNow() {
      try {
        var data = player.getVideoData();
        return (data && data.video_id) || '';
      } catch (err) {
        return '';
      }
    }

    function eventIsCurrent() {
      var seen = videoIdNow();
      return !seen || seen === activeId;
    }

    function rememberVideo(i) {
      activeId = TRACKS[i].id;
      primed = i;
      endHandledFor = '';
      errorHandledFor = '';
      loadedAt = Date.now();
    }

    function cueVideo(i, fromUser, keepFailCount) {
      if (i < 0 || i >= TRACKS.length) return;
      if (!keepFailCount) failCount = 0;
      ignoreError = false;
      rememberVideo(i);
      playing = false;
      if (fromUser) current = i;
      if (!playerReady || !player || typeof player.cueVideoById !== 'function') {
        queued = i;
        queueUser = !!fromUser;
        setStatus(fromUser ? HINT : 'LOADING PLAYER…');
        render();
        return;
      }
      queued = -1;
      try {
        player.cueVideoById({ videoId: activeId });
      } catch (err) {
        advance(true);
        return;
      }
      if (fromUser) setStatus(HINT);
      else if (!activated && current < 0) setStatus('SELECT A SONG TO BEGIN');
      render();
    }

    function beginPlayback(i, keepFailCount) {
      if (i < 0 || i >= TRACKS.length) return;
      if (!keepFailCount) failCount = 0;
      ignoreError = false;
      current = i;
      rememberVideo(i);
      playing = true;
      resetProgress();
      setStatus('NOW PLAYING: ' + TRACKS[i].title);
      render();
      try {
        player.loadVideoById({ videoId: activeId });
      } catch (err) {
        advance(true);
      }
    }

    function choose(i, keepFailCount) {
      if (!activated) cueVideo(i, true, keepFailCount);
      else beginPlayback(i, keepFailCount);
    }

    function halt() {
      ignoreError = true;
      playing = false;
      current = -1;
      queued = -1;
      failCount = 0;
      activeId = '';
      try { if (player && player.stopVideo) player.stopVideo(); } catch (err) {}
      resetProgress();
      setStatus('SELECT A SONG TO BEGIN');
      render();
    }

    function advance(isError) {
      if (ignoreError || !activeId) return;
      if (!eventIsCurrent()) return;
      if (isError) {
        if (errorHandledFor === activeId) return;
        var seen = videoIdNow();
        if (seen && seen !== activeId) return;
        if (!seen && Date.now() - loadedAt < 250) return;
        errorHandledFor = activeId;
        failCount += 1;
        if (failCount >= TRACKS.length) {
          halt();
          return;
        }
      } else {
        if (endHandledFor === activeId) return;
        if (Date.now() - loadedAt < 1500) {
          var duration = readDuration();
          var time = readTime();
          if (!(duration > 1 && time >= duration - 1.5)) return;
        }
        endHandledFor = activeId;
        failCount = 0;
      }
      var base = current >= 0 ? current : (primed >= 0 ? primed : 0);
      var next = (base + 1) % TRACKS.length;
      if (!activated) cueVideo(next, current >= 0, true);
      else beginPlayback(next, true);
    }

    function togglePlay() {
      if (!activated) {
        cueVideo(current >= 0 ? current : (primed >= 0 ? primed : 0), true, false);
        return;
      }
      if (current < 0) {
        beginPlayback(primed >= 0 ? primed : 0, false);
        return;
      }
      var state = readState();
      if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
        playing = false;
        setStatus('PAUSED: ' + TRACKS[current].title);
        render();
        try { player.pauseVideo(); } catch (err) {}
        return;
      }
      if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.CUED) {
        playing = true;
        setStatus('NOW PLAYING: ' + TRACKS[current].title);
        render();
        try { player.playVideo(); } catch (err) {}
        return;
      }
      beginPlayback(current, false);
    }

    function step(delta) {
      var count = TRACKS.length;
      var index = current < 0 ? (delta < 0 ? count - 1 : 0) : (current + delta + count) % count;
      if (!activated) cueVideo(index, true, false);
      else beginPlayback(index, false);
    }

    function syncIndexFromPlayer() {
      var id = videoIdNow();
      if (!id) return;
      var i;
      for (i = 0; i < TRACKS.length; i++) {
        if (TRACKS[i].id === id) {
          current = i;
          primed = i;
          activeId = id;
          return;
        }
      }
    }

    function onReady() {
      playerReady = true;
      hardenIframe();
      try { player.setVolume(100); } catch (err) {}
      var state = readState();
      if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
        if (state === YT.PlayerState.PLAYING) activated = true;
        syncIndexFromPlayer();
        if (current < 0) current = primed >= 0 ? primed : 0;
        playing = state === YT.PlayerState.PLAYING;
        if (playing && TRACKS[current]) setStatus('NOW PLAYING: ' + TRACKS[current].title);
        render();
        return;
      }
      if (queued >= 0) {
        var pending = queued;
        var fromUser = queueUser;
        queued = -1;
        cueVideo(pending, fromUser, false);
        return;
      }
      cueVideo(0, false, true);
      current = -1;
      playing = false;
      setStatus('SELECT A SONG TO BEGIN');
      render();
    }

    function onStateChange(event) {
      if (ignoreError) return;
      var state = event.data;
      if (state === YT.PlayerState.PLAYING) {
        activated = true;
        syncIndexFromPlayer();
        if (current < 0) current = primed >= 0 ? primed : 0;
        playing = true;
        failCount = 0;
        if (TRACKS[current]) setStatus('NOW PLAYING: ' + TRACKS[current].title);
        render();
        hardenIframe();
        return;
      }
      if (state === YT.PlayerState.PAUSED) {
        if (!activated || current < 0 || !TRACKS[current]) return;
        playing = false;
        setStatus('PAUSED: ' + TRACKS[current].title);
        render();
        return;
      }
      if (state === YT.PlayerState.ENDED) {
        if (!activated) return;
        playing = false;
        render();
        advance(false);
      }
    }

    function onPlayerError() {
      advance(true);
    }

    function onYouTubeIframeAPIReady() {
      var host = document.getElementById('yt-host');
      var frame = document.createElement('iframe');
      frame.id = 'yt-player';
      frame.title = 'Audio player';
      frame.setAttribute('allow', 'autoplay; encrypted-media');
      frame.setAttribute('playsinline', '');
      frame.setAttribute('webkit-playsinline', '');
      frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      var params = new URLSearchParams({
        enablejsapi: '1',
        controls: '0',
        playsinline: '1',
        rel: '0',
        modestbranding: '1',
        fs: '0',
        disablekb: '1',
        iv_load_policy: '3'
      });
      var origin = safeOrigin();
      if (origin) params.set('origin', origin);
      frame.src = 'https://www.youtube.com/embed/' + TRACKS[0].id + '?' + params.toString();
      host.appendChild(frame);
      fitIframe(frame);
      var vars = {
        controls: 0,
        playsinline: 1,
        rel: 0,
        modestbranding: 1,
        fs: 0,
        disablekb: 1,
        iv_load_policy: 3
      };
      if (origin) vars.origin = origin;
      player = new YT.Player(frame, {
        width: '200',
        height: '200',
        host: 'https://www.youtube.com',
        playerVars: vars,
        events: {
          onReady: onReady,
          onStateChange: onStateChange,
          onError: onPlayerError
        }
      });
      hardenIframe();
    }

    function paintTime(currentTime, duration) {
      elapsedEl.textContent = fmt(currentTime);
      durationEl.textContent = fmt(duration);
      var pct = duration > 0 ? Math.max(0, Math.min(100, (currentTime / duration) * 100)) : 0;
      fillEl.style.width = pct + '%';
      barEl.setAttribute('aria-valuenow', String(Math.round(pct)));
    }

    function readTime() {
      try { return player.getCurrentTime() || 0; } catch (err) { return 0; }
    }

    function readDuration() {
      try { return player.getDuration() || 0; } catch (err) { return 0; }
    }

    function seekTo(seconds, duration) {
      try { player.seekTo(seconds, true); } catch (err) { return; }
      paintTime(seconds, duration);
    }

    listEl.addEventListener('click', function (event) {
      var node = event.target;
      var row = null;
      while (node && node !== listEl) {
        if (node.classList && node.classList.contains('track')) {
          row = node;
          break;
        }
        node = node.parentNode;
      }
      if (!row) return;
      var index = Number(row.getAttribute('data-i'));
      if (!activated) {
        choose(index, false);
        return;
      }
      if (index === current) togglePlay();
      else choose(index, false);
    });

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', function () { step(-1); });
    nextBtn.addEventListener('click', function () { step(1); });

    barEl.addEventListener('click', function (event) {
      if (!playerReady || current < 0) return;
      var duration = readDuration();
      if (duration <= 0) return;
      var rect = barEl.getBoundingClientRect();
      var ratio = rect.width ? (event.clientX - rect.left) / rect.width : 0;
      if (ratio < 0) ratio = 0;
      if (ratio > 1) ratio = 1;
      seekTo(ratio * duration, duration);
    });

    barEl.addEventListener('keydown', function (event) {
      if (!playerReady || current < 0) return;
      var duration = readDuration();
      if (duration <= 0) return;
      var time = readTime();
      var next = time;
      if (event.key === 'ArrowRight') next = Math.min(duration, time + 5);
      else if (event.key === 'ArrowLeft') next = Math.max(0, time - 5);
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = duration;
      else return;
      event.preventDefault();
      seekTo(next, duration);
    });

    setInterval(function () {
      if (!playerReady || current < 0 || !player || typeof player.getCurrentTime !== 'function') return;
      paintTime(readTime(), readDuration());
    }, 250);

    render();

    var api = document.createElement('script');
    api.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(api);
  </script>
</body>
</html>
